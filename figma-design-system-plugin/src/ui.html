<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --figma-color-bg: #2c2c2c;
      --figma-color-bg-secondary: #383838;
      --figma-color-bg-hover: #444;
      --figma-color-text: #e0e0e0;
      --figma-color-text-secondary: #aaa;
      --figma-color-border: #555;
      --figma-color-brand: #18a0fb;
      --figma-color-brand-hover: #0d8de6;
      --figma-color-success: #1bc47d;
      --figma-color-danger: #f24822;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
      padding: 16px;
      line-height: 1.5;
    }

    h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .subtitle {
      color: var(--figma-color-text-secondary);
      margin-bottom: 16px;
      font-size: 11px;
    }

    /* ---- Sections ---- */
    .section {
      background: var(--figma-color-bg-secondary);
      border: 1px solid var(--figma-color-border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title .icon { font-size: 14px; }

    /* ---- Form controls ---- */
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--figma-color-text-secondary);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid var(--figma-color-border);
      border-radius: 6px;
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 10px;
    }

    input:focus, select:focus {
      border-color: var(--figma-color-brand);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > .field { flex: 1; }

    /* ---- Checkboxes ---- */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-bottom: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--figma-color-text);
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--figma-color-brand);
      width: 14px;
      height: 14px;
    }

    /* ---- Color preview ---- */
    .color-preview {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      margin-bottom: 10px;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ---- Buttons ---- */
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--figma-color-brand);
      color: #fff;
    }

    .btn-primary:hover { background: var(--figma-color-brand-hover); }

    .btn-secondary {
      background: var(--figma-color-bg-secondary);
      color: var(--figma-color-text);
      border: 1px solid var(--figma-color-border);
    }

    .btn-secondary:hover { background: var(--figma-color-bg-hover); }

    /* ---- Status ---- */
    .status-bar {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }

    .status-bar.success {
      display: block;
      background: rgba(27,196,125,0.12);
      color: var(--figma-color-success);
      border: 1px solid rgba(27,196,125,0.25);
    }

    .status-bar.error {
      display: block;
      background: rgba(242,72,34,0.12);
      color: var(--figma-color-danger);
      border: 1px solid rgba(242,72,34,0.25);
    }

    .status-bar.info {
      display: block;
      background: rgba(24,160,251,0.12);
      color: var(--figma-color-brand);
      border: 1px solid rgba(24,160,251,0.25);
    }
  </style>
</head>
<body>

  <h2>🎨 Design System Generator</h2>
  <p class="subtitle">Generate a complete design system on your current Figma page.</p>

  <!-- Color Palette -->
  <div class="section">
    <div class="section-title"><span class="icon">🎨</span> Color Palette</div>
    <label for="brandColor">Brand Primary Color (hex)</label>
    <input type="text" id="brandColor" value="#6366F1" maxlength="7" />
    <div class="color-preview" id="colorPreview"></div>
    <label>Color shades to generate</label>
    <div class="checkbox-group">
      <label class="checkbox-label"><input type="checkbox" value="50"  checked /> 50</label>
      <label class="checkbox-label"><input type="checkbox" value="100" checked /> 100</label>
      <label class="checkbox-label"><input type="checkbox" value="200" checked /> 200</label>
      <label class="checkbox-label"><input type="checkbox" value="300" checked /> 300</label>
      <label class="checkbox-label"><input type="checkbox" value="400" checked /> 400</label>
      <label class="checkbox-label"><input type="checkbox" value="500" checked /> 500</label>
      <label class="checkbox-label"><input type="checkbox" value="600" checked /> 600</label>
      <label class="checkbox-label"><input type="checkbox" value="700" checked /> 700</label>
      <label class="checkbox-label"><input type="checkbox" value="800" checked /> 800</label>
      <label class="checkbox-label"><input type="checkbox" value="900" checked /> 900</label>
    </div>
    <label class="checkbox-label" style="margin-bottom:4px;">
      <input type="checkbox" id="includeNeutrals" checked /> Also generate neutral gray palette
    </label>
  </div>

  <!-- Typography -->
  <div class="section">
    <div class="section-title"><span class="icon">🔤</span> Typography</div>
    <div class="row">
      <div class="field">
        <label for="fontFamily">Font Family</label>
        <select id="fontFamily">
          <option value="Inter">Inter</option>
          <option value="Roboto">Roboto</option>
          <option value="SF Pro Display">SF Pro Display</option>
          <option value="Poppins">Poppins</option>
          <option value="Open Sans">Open Sans</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Lato">Lato</option>
          <option value="Nunito">Nunito</option>
        </select>
      </div>
      <div class="field">
        <label for="baseSize">Base Size (px)</label>
        <input type="number" id="baseSize" value="16" min="10" max="24" />
      </div>
    </div>
    <label for="typeScale">Type Scale</label>
    <select id="typeScale">
      <option value="1.125">Minor Second (1.125)</option>
      <option value="1.200">Minor Third (1.200)</option>
      <option value="1.250" selected>Major Third (1.250)</option>
      <option value="1.333">Perfect Fourth (1.333)</option>
      <option value="1.414">Augmented Fourth (1.414)</option>
      <option value="1.500">Perfect Fifth (1.500)</option>
      <option value="1.618">Golden Ratio (1.618)</option>
    </select>
  </div>

  <!-- Components -->
  <div class="section">
    <div class="section-title"><span class="icon">🧩</span> UI Components</div>
    <label>Select components to generate</label>
    <div class="checkbox-group">
      <label class="checkbox-label"><input type="checkbox" value="buttons" checked /> Buttons</label>
      <label class="checkbox-label"><input type="checkbox" value="inputs" checked /> Inputs</label>
      <label class="checkbox-label"><input type="checkbox" value="cards" checked /> Cards</label>
      <label class="checkbox-label"><input type="checkbox" value="badges" checked /> Badges</label>
      <label class="checkbox-label"><input type="checkbox" value="avatars" checked /> Avatars</label>
      <label class="checkbox-label"><input type="checkbox" value="toggles" checked /> Toggles</label>
    </div>
  </div>

  <!-- Spacing -->
  <div class="section">
    <div class="section-title"><span class="icon">📐</span> Spacing & Grid</div>
    <div class="row">
      <div class="field">
        <label for="spacingBase">Spacing Unit (px)</label>
        <input type="number" id="spacingBase" value="8" min="4" max="16" />
      </div>
      <div class="field">
        <label for="spacingSteps">Number of Steps</label>
        <input type="number" id="spacingSteps" value="8" min="4" max="12" />
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="btn-group">
    <button class="btn-secondary" id="cancelBtn">Cancel</button>
    <button class="btn-primary" id="generateBtn">✨ Generate Design System</button>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <script>
    // ---- Color preview ----
    function hexToHsl(hex) {
      let r = parseInt(hex.slice(1,3), 16) / 255;
      let g = parseInt(hex.slice(3,5), 16) / 255;
      let b = parseInt(hex.slice(5,7), 16) / 255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      let h, s, l = (max + min) / 2;
      if (max === min) { h = s = 0; }
      else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch(max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const a = s * Math.min(l, 1 - l);
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function generateShadeHex(baseHex, shade) {
      const [h, s, _l] = hexToHsl(baseHex);
      const lightnessMap = { 50:97, 100:93, 200:86, 300:74, 400:62, 500:50, 600:42, 700:34, 800:26, 900:18 };
      return hslToHex(h, Math.min(s + 10, 100), lightnessMap[shade] || 50);
    }

    function updatePreview() {
      const hex = document.getElementById('brandColor').value;
      const container = document.getElementById('colorPreview');
      if (!/^#[0-9a-fA-F]{6}$/.test(hex)) { container.innerHTML = ''; return; }
      const shades = [50,100,200,300,400,500,600,700,800,900];
      container.innerHTML = shades.map(s =>
        `<div class="color-swatch" style="background:${generateShadeHex(hex,s)}" title="${s}"></div>`
      ).join('');
    }

    document.getElementById('brandColor').addEventListener('input', updatePreview);
    updatePreview();

    // ---- Status helpers ----
    function showStatus(msg, type) {
      const bar = document.getElementById('statusBar');
      bar.textContent = msg;
      bar.className = 'status-bar ' + type;
    }

    // ---- Generate ----
    document.getElementById('generateBtn').addEventListener('click', () => {
      const brandColor = document.getElementById('brandColor').value.trim();
      if (!/^#[0-9a-fA-F]{6}$/.test(brandColor)) {
        showStatus('⚠ Please enter a valid hex color (e.g. #6366F1)', 'error');
        return;
      }

      const shadeCheckboxes = document.querySelectorAll('.checkbox-group input[type="checkbox"][value]');
      const selectedShades = [];
      const selectedComponents = [];
      shadeCheckboxes.forEach(cb => {
        if (cb.checked) {
          if (['50','100','200','300','400','500','600','700','800','900'].includes(cb.value)) {
            selectedShades.push(parseInt(cb.value));
          } else {
            selectedComponents.push(cb.value);
          }
        }
      });

      // Collect component checkboxes separately
      const compCheckboxes = document.querySelectorAll('.section:nth-child(4) .checkbox-group input[type="checkbox"]');
      const components = [];
      compCheckboxes.forEach(cb => { if (cb.checked) components.push(cb.value); });

      const config = {
        brandColor,
        shades: selectedShades,
        includeNeutrals: document.getElementById('includeNeutrals').checked,
        fontFamily: document.getElementById('fontFamily').value,
        baseSize: parseInt(document.getElementById('baseSize').value) || 16,
        typeScale: parseFloat(document.getElementById('typeScale').value) || 1.25,
        components,
        spacingBase: parseInt(document.getElementById('spacingBase').value) || 8,
        spacingSteps: parseInt(document.getElementById('spacingSteps').value) || 8,
      };

      showStatus('⏳ Generating design system…', 'info');
      parent.postMessage({ pluginMessage: { type: 'generate', config } }, '*');
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    });

    // ---- Messages from plugin ----
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'status') {
        showStatus(msg.message, msg.status || 'info');
      }
    };
  </script>

</body>
</html>
